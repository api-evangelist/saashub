naftiko: "1.0.0-alpha1"

info:
  label: "SaaSHub API"
  description: "SaaSHub software discovery platform API providing product lookup and alternatives discovery for SaaS, web, and cloud-based applications."
  tags:
    - SaaSHub
    - Software Discovery
    - Alternatives
    - SaaS
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SAASHUB_API_KEY: SAASHUB_API_KEY

capability:
  consumes:
    - type: http
      namespace: saashub
      baseUri: https://www.saashub.com/api
      description: "SaaSHub public REST API for software discovery"
      authentication:
        type: apikey
        key: api_key
        value: "{{SAASHUB_API_KEY}}"
        placement: query
      resources:
        - name: product
          path: /product
          description: "Software product lookup by name"
          operations:
            - name: get-product
              method: GET
              description: "Get software product data by name query"
              inputParameters:
                - name: query
                  in: path
                  type: string
                  required: true
                  description: "Product name to search for (e.g., basecamp, slack, notion)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: alternatives
          path: /alternatives
          description: "Software alternatives discovery"
          operations:
            - name: get-product-alternatives
              method: GET
              description: "Get a product and its top 10 alternatives by name query"
              inputParameters:
                - name: query
                  in: path
                  type: string
                  required: true
                  description: "Product name to find alternatives for"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: saashub-rest
      resources:
        - path: /v1/products/{query}
          name: products
          description: "Software product data"
          operations:
            - method: GET
              name: get-product
              description: "Get product by name"
              call: "saashub.get-product"
              with:
                query: "rest.query"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/alternatives/{query}
          name: alternatives
          description: "Software product alternatives"
          operations:
            - method: GET
              name: get-product-alternatives
              description: "Get product with alternatives"
              call: "saashub.get-product-alternatives"
              with:
                query: "rest.query"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: saashub-mcp
      transport: http
      tools:
        - name: get-product
          description: "Look up a software product on SaaSHub by name"
          hints:
            readOnly: true
            openWorld: true
          call: "saashub.get-product"
          with:
            query: "tools.query"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-product-alternatives
          description: "Find the top 10 software alternatives for a given product on SaaSHub"
          hints:
            readOnly: true
            openWorld: true
          call: "saashub.get-product-alternatives"
          with:
            query: "tools.query"
          outputParameters:
            - type: object
              mapping: "$."
