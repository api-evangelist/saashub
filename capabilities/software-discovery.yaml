naftiko: 1.0.0-alpha2
info:
  label: SaaSHub Software Discovery
  description: Software discovery and alternatives research capability using the SaaSHub platform. Enables product research,
    competitive analysis, and vendor replacement discovery for SaaS procurement and IT asset management workflows.
  tags:
  - SaaSHub
  - Software Discovery
  - Alternatives
  - SaaS Procurement
  - Competitive Analysis
  created: '2026-05-02'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    SAASHUB_API_KEY: SAASHUB_API_KEY
capability:
  consumes:
  - type: http
    namespace: saashub
    baseUri: https://www.saashub.com/api
    description: SaaSHub public REST API for software discovery
    authentication:
      type: apikey
      key: api_key
      value: '{{SAASHUB_API_KEY}}'
      placement: query
    resources:
    - name: product
      path: /product
      description: Software product lookup by name
      operations:
      - name: get-product
        method: GET
        description: Get software product data by name query
        inputParameters:
        - name: query
          in: path
          type: string
          required: true
          description: Product name to search for (e.g., basecamp, slack, notion)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: alternatives
      path: /alternatives
      description: Software alternatives discovery
      operations:
      - name: get-product-alternatives
        method: GET
        description: Get a product and its top 10 alternatives by name query
        inputParameters:
        - name: query
          in: path
          type: string
          required: true
          description: Product name to find alternatives for
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: software-discovery-api
    description: Unified REST API for software discovery and alternatives research.
    resources:
    - path: /v1/products/{query}
      name: products
      description: Software product lookup
      operations:
      - method: GET
        name: get-product
        description: Look up a software product on SaaSHub by name
        call: saashub.get-product
        with:
          query: rest.query
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/alternatives/{query}
      name: alternatives
      description: Software product alternatives
      operations:
      - method: GET
        name: get-alternatives
        description: Get top 10 software alternatives for a product
        call: saashub.get-product-alternatives
        with:
          query: rest.query
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: software-discovery-mcp
    transport: http
    description: MCP server for AI-assisted software discovery and procurement research.
    tools:
    - name: lookup-software-product
      description: Look up detailed information about a software product on SaaSHub including name, tagline, categories, pricing,
        and website URL.
      hints:
        readOnly: true
        openWorld: true
      call: saashub.get-product
      with:
        query: tools.query
      outputParameters:
      - type: object
        mapping: $.
    - name: find-software-alternatives
      description: Find the top 10 software alternatives for a given product on SaaSHub. Useful for vendor replacement research,
        competitive analysis, and procurement decisions.
      hints:
        readOnly: true
        openWorld: true
      call: saashub.get-product-alternatives
      with:
        query: tools.query
      outputParameters:
      - type: object
        mapping: $.
