    type: Authentication
  description: >-
    The SaaSHub API provides programmatic access to SaaSHub's software discovery
    platform, allowing developers to search for software products and retrieve
    relevant alternatives. The API offers two primary endpoints: a product endpoint
    that returns data for the first product matching a query, and an alternatives
    endpoint that returns the matching product along with its top 10 relevant
    alternatives. Authentication is performed via an API key available in user
    profiles. The API follows the JSON:API specification and is useful for building
    software comparison tools, recommendation engines, and SaaS discovery features.
    Users of the API are required to disclose their use of SaaSHub data on their
    websites.
